<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochilas Wayuu</title>
  <link rel="stylesheet" href="../css_emprendedores/mochila.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <a href="../index.html">
      <img src="../img/logowebnew.png" alt="Artesanías CTG" class="logo">
    </a>
  </div>

  <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>

  <nav id="mainNav">
    <button class="close-menu" id="closeNav"><i class="fa-solid fa-xmark"></i></button>
    <ul>
      <li><a href="../index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
      <li><a href="#catalogo"><i class="fa-solid fa-bag-shopping"></i> Catálogo</a></li>
      <li><a href="#anuncios"><i class="fa-solid fa-tag"></i> Ofertas</a></li>
    </ul>
  </nav>

  <div class="header-right">
    <div class="cart-icon" id="cartBtn">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
  </div>
</header>

<!-- SLIDER ANUNCIOS -->
<section class="hero-slider" id="slider">
  <div class="slides-wrapper" id="slidesWrapper"></div>
  <button class="slider-btn prev" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="slider-btn next" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="slider-dots" id="sliderDots"></div>
</section>

<!-- LAYOUT PRINCIPAL -->
<div class="main-layout">

  <!-- COLUMNA IZQUIERDA: CATÁLOGO -->
  <main class="catalogo-col">

    <!-- BUSCADOR Y FILTROS -->
    <section class="filtros-section">
      <h2 class="section-title">Nuestras Mochilas</h2>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar mochila...">
      </div>

      <div class="filtros">
        <div class="filtro-grupo">
          <label>Categoría</label>
          <select id="filtroCategoria">
            <option value="">Todas</option>
            <option value="grande">Grande</option>
            <option value="mediana">Mediana</option>
            <option value="pequeña">Pequeña</option>
            <option value="clutch">Clutch</option>
          </select>
        </div>

        <div class="filtro-grupo">
          <label>Color</label>
          <select id="filtroColor">
            <option value="">Todos</option>
            <option value="rojo">Rojo</option>
            <option value="azul">Azul</option>
            <option value="verde">Verde</option>
            <option value="amarillo">Amarillo</option>
            <option value="multicolor">Multicolor</option>
            <option value="naranja">Naranja</option>
            <option value="morado">Morado</option>
          </select>
        </div>

        <div class="filtro-grupo">
          <label>Precio</label>
          <select id="filtroPrecio">
            <option value="">Todos</option>
            <option value="0-80000">Hasta $80.000</option>
            <option value="80000-150000">$80.000 - $150.000</option>
            <option value="150000-999999">Más de $150.000</option>
          </select>
        </div>

        <button class="btn-limpiar" id="btnLimpiar">
          <i class="fa-solid fa-rotate-left"></i> Limpiar
        </button>
      </div>
    </section>

    <!-- GRID PRODUCTOS -->
    <section id="catalogo" class="catalogo-section">
      <div class="resultado-info" id="resultadoInfo"></div>
      <div id="grid" class="catalogo-grid"></div>
      <div id="noResultados" class="no-resultados" style="display:none;">
        <i class="fa-solid fa-face-sad-tear"></i>
        <p>No encontramos productos con esos filtros</p>
        <button class="btn-limpiar" onclick="limpiarFiltros()">Ver todos</button>
      </div>
    </section>
  </main>

  <!-- COLUMNA DERECHA: ANUNCIOS LATERALES -->
  <aside class="sidebar-anuncios" id="anuncios">
    <h3 class="sidebar-title"><i class="fa-solid fa-star"></i> Destacados</h3>
    <div id="anunciosLaterales"></div>

    <div class="sidebar-banner">
      <i class="fa-solid fa-truck-fast"></i>
      <strong>Envío gratis</strong>
      <span>en compras mayores a $200.000</span>
    </div>

    <div class="sidebar-banner segunda">
      <i class="fa-brands fa-whatsapp"></i>
      <strong>¿Tienes dudas?</strong>
      <span>Escríbenos por WhatsApp</span>
    </div>
  </aside>
</div>

<!-- CARRITO LATERAL -->
<div id="cartPanel" class="cart-panel">
  <div class="cart-header">
    <h3><i class="fa-solid fa-cart-shopping"></i> Mi Carrito</h3>
    <button id="closeCart"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <strong>$<span id="total">0</span></strong>
    </div>
    <button class="btn-checkout" onclick="checkout()">
      <i class="fa-solid fa-check"></i> Confirmar pedido
    </button>
  </div>
</div>
<div id="cartOverlay" class="cart-overlay"></div>

<script src="../scripEmprendedores/mochila.js"></script>
</body>
</html>
