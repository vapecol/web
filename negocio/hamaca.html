body {

    margin: 0;

}

/* header */
header {
    background:

}

a {
    text-decoration: none;
    color: white;
}

/* contenedor */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}
.product-view {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
}

/* miniaturas */
.thumbnails {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 300px;
    overflow-y: auto;
}

.thumbnails img {
    width: 80px;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.3s;
    border: 2px solid transparent;
}

.thumbnails img:hover {
    transform: scale(1.05);
    border: 2px solid #e76f51;
}

/* imagen principal */
.main-image {
    text-align: center;
}

.main-image img {
    width: 300px;
    border-radius: 10px;
}

.price {
    font-size: 22px;
    color: #e76f51;
    font-weight: bold;
    margin-top: 10px;
}

/* producto */
.product {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
}

.product img {
    width: 300px;
    border-radius: 10px;
}

/* precio */
.price {

/* botones */
.buttons {

button {

    border-radius: 8px;

    margin: 5px;

.whatsapp {

}

.comprar {

    color: white;

.volver {

    color: black;
}

</style>
