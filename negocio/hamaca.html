<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamacas Caribeñas</title>

  <!-- Solo el CSS propio — sin styles.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css_emprendedores/hamaca.css">
</head>

<body>

<header>
  <div class="logo">
    <a href="../index.html">
      <img src="../img/logowebnew.png" alt="Artesanías CTG" class="logo">
    </a>
  </div>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <nav id="navMenu">
    <button class="close-menu" id="closeMenu">✕</button>
    <ul>
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="#catalogo">Catálogo</a></li>
      <li><a href="#emprendedores">Emprendedores</a></li>
      <li><a href="#problema">Problema/Solución</a></li>
      <li><a href="#beneficios">Beneficios</a></li>
      <li><a href="#contacto">Contacto</a></li>
    </ul>
  </nav>
  <div class="lang-switcher">
    <button id="es" class="active">ES</button>
    <button id="en">EN</button>
  </div>
</header>

<!-- SLIDER -->
<section class="hero-slider" aria-label="Anuncios destacados">
  <div id="slider-wrapper"></div>
  <button class="slider-arrow prev" onclick="anteriorSlide()" aria-label="Anterior">
    <i class="fa-solid fa-chevron-left"></i>
  </button>
  <button class="slider-arrow next" onclick="siguienteSlide()" aria-label="Siguiente">
    <i class="fa-solid fa-chevron-right"></i>
  </button>
  <div class="slider-dots" id="slider-dots"></div>
</section>

<!-- CATÁLOGO -->
<section id="catalogo" class="catalogo-section">
  <div class="filtros">
    <p class="filtros-titulo">Nuestras Hamacas</p>
    <input type="text" id="buscador" placeholder="🔍 Buscar hamaca..." />
    <select id="orden">
      <option value="default">Ordenar por</option>
      <option value="asc">Precio: menor a mayor</option>
      <option value="desc">Precio: mayor a menor</option>
    </select>
  </div>
  <div class="catalogo-grid" id="catalogo-grid"></div>
</section>

<footer>
  <p>© 2025 Artesanías Cartagena. Todos los derechos reservados.</p>
</footer>

<script src="../scripEmprendedores/hamaca.js"></script>

<script>
  // Menú hamburguesa
  const toggle = document.getElementById('menuToggle');
  const nav    = document.getElementById('navMenu');
  const close  = document.getElementById('closeMenu');
  toggle?.addEventListener('click', () => nav.classList.add('active'));
  close?.addEventListener('click',  () => nav.classList.remove('active'));
</script>

</body>
</html>
